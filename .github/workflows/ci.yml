name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      run: pip install -r requirements.txt

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    # Build core library + C++ unit tests
    - name: Configure core library
      run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DMESHPARAM_BUILD_TESTS=ON -DMESHPARAM_BUILD_CLI=ON

    - name: Build core library + tests
      run: cmake --build build

    - name: Run C++ unit tests
      run: ctest --test-dir build --output-on-failure --timeout 60

    # Build server + bench CLI (without MKL — CM method disabled)
    - name: Configure server
      run: |
        cd server
        cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build server
      run: cmake --build server/build

    # Python regression tests
    - name: Run tessellation tests
      run: python -m pytest tests/test_tessellation.py -v --tb=short --no-header -p no:cacheprovider

    - name: Run parameterization tests
      run: python -m pytest tests/test_parameterization.py -v --tb=short --no-header -p no:cacheprovider

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/regression_report.html
        retention-days: 30

  # Docker build verification (Linux)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t meshparam:ci .

    - name: Verify Docker image
      run: |
        docker run --rm meshparam:ci ./server/build/meshparam_bench --help || true
        docker run --rm meshparam:ci python3 -c "import gmsh; print('Gmsh OK')"

version: "3.8"

services:
  meshparam:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Persist logs
      - ./logs:/app/logs
      # Mount STEP files for testing
      - ./models/step:/app/models/step:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

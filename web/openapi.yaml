openapi: 3.0.3
info:
  title: Mesh Parameterization API
  description: >
    HTTP API for triangle mesh UV parameterization. Accepts glTF binary (.glb)
    meshes and returns parameterized meshes with UV coordinates. Also supports
    STEP-to-GLB tessellation via Gmsh or OpenCascade backends.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/health:
    get:
      summary: Health check
      description: Returns a simple status object to verify the server is running.
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /api/tessellate/step:
    post:
      summary: Tessellate a STEP file to GLB
      description: >
        Accepts a binary STEP file and returns a tessellated triangle mesh in
        glTF binary (.glb) format. Uses Gmsh + OpenCascade pipeline.


        ## GLB Output Structure


        ### Primitives

        The output GLB contains 1 or 2 triangle primitives (mode=4):

        - **1 primitive**: No auto-seam detected; the full mesh as a single part.

        - **2 primitives**: Auto-seam detected (Z-perpendicular B-Rep edge loop found).
          Primitive 0 = front/top faces (Z+ normals), Primitive 1 = back/bottom faces.
          The split is topological (flood-fill on OCC face adjacency, seam edges as barrier),
          not geometric (not centroid-Z classification).


        ### Per-Vertex Attributes

        Each triangle primitive has these vertex attributes:

        - `POSITION` (VEC3, float32): Vertex position in mm.

        - `NORMAL` (VEC3, float32): Surface normal queried from the OCC B-Rep surface
          at the parametric position of each mesh node. Not interpolated from triangulation —
          comes directly from the analytical CAD surface. Vertices are split at B-Rep face
          boundaries so normals are sharp across face edges.

        - `_FACE_ID` (SCALAR, float32): OCC B-Rep face index for each vertex.
          Vertices on the same B-Rep face share the same value. Used to identify
          face boundaries in the viewer.

        - `_SEAM` (SCALAR, float32): 1.0 for vertices on the auto-seam loop, 0.0 otherwise.
          Only present when a Z-perpendicular seam was detected.


        ### Node Extras — B-Rep Edge Lines

        The glTF node (nodes[0]) contains an `extras.edgeLines` object with B-Rep edge
        polyline data for visualization. Each key maps to a flat array of 3D point pairs
        `[x0,y0,z0, x1,y1,z1, ...]` representing line segments along the B-Rep curves.
        Points are offset 0.05mm along the surface normal to avoid Z-fighting.

        - `edgeLines.seam` (array of float): Line segments along the auto-seam loop
          (the longest Z-perpendicular B-Rep edge loop). Displayed in **red**.

        - `edgeLines.zperp` (array of float): Line segments along other Z-perpendicular
          B-Rep edges (not the seam). Displayed in **orange**.

        - `edgeLines.other` (array of float): Line segments along all remaining B-Rep
          edges. Displayed in **yellow**.

        Edge nodes are sorted by parametric coordinate along each OCC curve, so consecutive
        point pairs form a proper polyline (no random connections). Coordinates are in the
        same space as POSITION (mm, right-handed). The BabylonJS viewer parents these lines
        to the glTF root node to inherit the left-handed Z-flip transform.


        ### Auto-Seam Detection

        The pipeline automatically finds the longest closed loop of Z-perpendicular B-Rep
        edges (all edge endpoints at the same Z within 0.5mm tolerance). If found and it
        divides the mesh into two balanced halves (neither side < 10% of faces), it is used
        as the seam for splitting. Among equal-length candidates, the loop at minimum Z is
        chosen. The seam loop is stored in `edgeLines.seam` and marked with `_SEAM=1.0`
        on the corresponding mesh vertices.


        ### Meshing Parameters

        - Chord deviation target: configurable via `deflection` parameter (default 1mm).

        - Curvature-adaptive: `MeshSizeFromCurvature = N` elements per 2π.

        - Min/max edge size derived from bounding box extent.

        - Gmsh Frontal-Delaunay algorithm (Algorithm 6).

        - OCC shape healing applied before meshing.

        - Auto unit detection: meters→mm, inches→mm scaling.
      operationId: tessellateStep
      parameters:
        - name: tessellator
          in: query
          required: false
          description: Tessellation backend to use.
          schema:
            type: string
            enum: [gmsh, occ]
            default: gmsh
        - name: deflection
          in: query
          required: false
          description: Chord deviation tolerance for tessellation (mm).
          schema:
            type: number
            format: double
            default: 1.0
      requestBody:
        required: true
        description: Raw STEP file content.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Tessellated GLB mesh.
          headers:
            X-Tessellator:
              description: The tessellation backend that was used.
              schema:
                type: string
                example: gmsh
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unreadable STEP data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Tessellation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: No tessellator backend configured on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: No tessellator configured

  /api/parameterize:
    post:
      summary: Parameterize a GLB mesh
      description: >
        Accepts a glTF binary (.glb) triangle mesh and returns a parameterized
        GLB with UV coordinates. When method is "auto" (default), the broker
        runs all available methods in parallel and picks the best result based
        on a composite quality score (Symmetric Dirichlet energy + flip count).


        ## GLB Output Structure


        The parameterized GLB preserves the input structure (1 or 2 primitives)
        and adds:

        - `TEXCOORD_0` (VEC2, float32): UV coordinates from the winning method,
          normalized to [0,1] range.

        - `_SEAM` (SCALAR, float32): Seam vertices (preserved from input).

        - `NORMAL` and `_FACE_ID` are preserved from the input GLB.

        - `extras.edgeLines` is NOT present in the parameterized output (cached
          client-side from the tessellation step).


        ## Split Mesh Handling

        When the input has 2 primitives (front/back split from auto-seam):

        - Primitive 0 (front): parameterized with the full broker (all methods compete).

        - Primitive 1 (back): parameterized with LSCM only (fast, reliable, back face
          is less visually important).

        - Results are combined into a single output GLB.


        ## Available Methods

        - `heat`: Heat-geodesic MDS (O(n²), limit ~5K vertices).

        - `lscm`: Least Squares Conformal Maps (fastest, robust).

        - `igl_arap`: As-Rigid-As-Possible (libigl).

        - `slim`: Scalable Locally Injective Maps (Symmetric Dirichlet optimizer).

        - `cgal_conformal`: CGAL Discrete Conformal.

        - `cgal_arap`: CGAL ARAP (best reliability + quality balance).

        - `cgal_authalic`: CGAL Discrete Authalic.

        - `cm`: Composite Majorization (Newton-based, best quality when converges).
      operationId: parameterize
      parameters:
        - name: method
          in: query
          required: false
          description: >
            Parameterization method. Use "auto" to let the broker pick the best
            result from all methods.
          schema:
            type: string
            enum:
              - auto
              - heat
              - lscm
              - igl_arap
              - slim
              - cgal_conformal
              - cgal_arap
              - cgal_authalic
              - cm
            default: auto
      requestBody:
        required: true
        description: Raw GLB file content.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Parameterized GLB mesh with UV coordinates.
          headers:
            X-Method:
              description: The parameterization method used for the returned result.
              schema:
                type: string
                example: cgal_arap
            X-Metrics:
              description: >
                JSON object with quality metrics for the selected method.
              schema:
                type: string
              example: >
                {"angle_mean":0.02,"angle_max":0.15,"area_mean":0.03,"stretch_mean":1.01,"score":0.85,"sym_dirichlet":1.12,"flipped_tris":0,"l2_area":0.04,"linf_area":0.08}
            X-All-Methods:
              description: >
                JSON array with results and metrics from all attempted methods
                (only present when method=auto).
              schema:
                type: string
              example: >
                [{"method":"cgal_arap","score":0.85,"metrics":{...}},{"method":"heat","score":0.72,"metrics":{...}}]
            X-Session:
              description: Session identifier for correlating requests.
              schema:
                type: string
                example: abc123
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unreadable GLB data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: All parameterization methods failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /api/docs:
    get:
      summary: API documentation UI
      description: Redirects to the Swagger UI page.
      operationId: getDocs
      responses:
        "302":
          description: Redirect to /swagger.html

  /api/openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns this OpenAPI specification in YAML format.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: The OpenAPI 3.0 specification.
          content:
            text/yaml:
              schema:
                type: string

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
      example:
        error: Something went wrong

    Metrics:
      type: object
      description: Quality metrics for a parameterization result.
      properties:
        angle_mean:
          type: number
          format: double
          description: Mean angle distortion.
        angle_max:
          type: number
          format: double
          description: Maximum angle distortion.
        area_mean:
          type: number
          format: double
          description: Mean area distortion.
        stretch_mean:
          type: number
          format: double
          description: Mean stretch factor.
        score:
          type: number
          format: double
          description: Composite quality score (higher is better).
        sym_dirichlet:
          type: number
          format: double
          description: Symmetric Dirichlet energy.
        flipped_tris:
          type: integer
          description: Number of flipped (inverted) triangles in UV space.
        l2_area:
          type: number
          format: double
          description: L2 area distortion.
        linf_area:
          type: number
          format: double
          description: L-infinity area distortion.

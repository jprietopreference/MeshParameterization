openapi: 3.0.3
info:
  title: Mesh Parameterization API
  description: >
    HTTP API for triangle mesh UV parameterization. Accepts glTF binary (.glb)
    meshes and returns parameterized meshes with UV coordinates. Also supports
    STEP-to-GLB tessellation via Gmsh or OpenCascade backends.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/health:
    get:
      summary: Health check
      description: Returns a simple status object to verify the server is running.
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
              example:
                status: ok

  /api/tessellate/step:
    post:
      summary: Tessellate a STEP file to GLB
      description: |
        Accepts a binary STEP file and returns a tessellated triangle mesh in glTF binary (.glb) format. Uses the Gmsh + OpenCascade pipeline.

        ## GLB Output Structure

        ### glTF Mesh Primitives

        The output GLB contains a single `mesh` with **1 or 2 triangle primitives** (mode=4), sharing one vertex buffer:

        | Condition | Primitives | Description |
        |-----------|-----------|-------------|
        | No auto-seam | 1 primitive | Full mesh as a single part |
        | Auto-seam detected | 2 primitives | **Primitive 0** = front faces (Z+ normals), **Primitive 1** = back faces |

        When 2 primitives are present, the split is **topological**: a flood-fill on OCC face adjacency with the seam edges as barrier. Both primitives index into the same shared vertex buffer — Primitive 0 uses indices `[0, N_front)` and Primitive 1 uses indices `[N_front, N_total)`.

        ### Per-Vertex Attributes

        All primitives reference the same vertex attribute accessors:

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `POSITION` | VEC3, float32 | Vertex position in mm |
        | `NORMAL` | VEC3, float32 | OCC B-Rep surface normal at the parametric position of each node. Not interpolated — queried from the analytical CAD surface. Vertices split at B-Rep face boundaries for sharp creases. |
        | `_FACE_ID` | SCALAR, float32 | OCC B-Rep face index. Vertices on the same face share the same value. |
        | `_SEAM` | SCALAR, float32 | `1.0` for vertices on the auto-seam loop, `0.0` otherwise. |

        ### Node Extras — B-Rep Edge Lines

        `nodes[0].extras.edgeLines` contains B-Rep edge polyline data for visualization. Each key maps to a flat array of 3D point pairs `[x0,y0,z0, x1,y1,z1, ...]`:

        | Key | Color | Description |
        |-----|-------|-------------|
        | `seam` | Red | Auto-seam loop (longest Z-perpendicular B-Rep edge loop) |
        | `zperp` | Orange | Other Z-perpendicular B-Rep edges |
        | `other` | Yellow | All remaining B-Rep edges |

        Edge nodes are sorted by parametric coordinate along each OCC curve. Points are offset 0.05mm along the surface normal to avoid Z-fighting. Coordinates are in mm, right-handed (glTF convention).

        ### Auto-Seam Detection

        The pipeline finds the longest closed loop of Z-perpendicular B-Rep edges (all endpoints at same Z ±0.5mm). If the loop divides the mesh into two balanced halves (neither < 10% of faces), it becomes the seam. Among equal-length candidates, the loop at minimum Z is chosen.

        ### Meshing Parameters

        | Parameter | Value |
        |-----------|-------|
        | Chord deviation | Configurable via `deflection` (default 1mm) |
        | Curvature elements | `MeshSizeFromCurvature = N` elements per 2π |
        | Edge size limits | Derived from bounding box extent |
        | Algorithm | Gmsh Frontal-Delaunay (Algorithm 6) |
        | Preprocessing | OCC shape healing before meshing |
        | Units | Auto-detect: meters→mm, inches→mm |
      operationId: tessellateStep
      parameters:
        - name: tessellator
          in: query
          required: false
          description: Tessellation backend to use.
          schema:
            type: string
            enum: [gmsh, occ]
            default: gmsh
        - name: deflection
          in: query
          required: false
          description: Chord deviation tolerance for tessellation (mm).
          schema:
            type: number
            format: double
            default: 1.0
      requestBody:
        required: true
        description: Raw STEP file content.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Tessellated GLB mesh.
          headers:
            X-Tessellator:
              description: The tessellation backend that was used.
              schema:
                type: string
                example: gmsh
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unreadable STEP data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Tessellation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: No tessellator backend configured on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: No tessellator configured

  /api/parameterize:
    post:
      summary: Parameterize a GLB mesh
      description: |
        Accepts a glTF binary (.glb) triangle mesh and returns a parameterized GLB with UV coordinates. When method is "auto" (default), the broker runs all methods in parallel and picks the best by Symmetric Dirichlet energy + flip count.

        ## GLB Output Structure

        The parameterized GLB preserves the input primitive structure (1 or 2 primitives) and adds:

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `TEXCOORD_0` | VEC2, float32 | UV coordinates, normalized to [0,1] |
        | `_SEAM` | SCALAR, float32 | Preserved from input |
        | `NORMAL` | VEC3, float32 | Preserved from input |
        | `_FACE_ID` | SCALAR, float32 | Preserved from input |

        Note: `extras.edgeLines` is NOT present in the parameterized output (the viewer caches it from the tessellation step).

        ## Split Mesh Handling

        When the input has 2 primitives (front/back from auto-seam):

        | Primitive | Strategy | Reason |
        |-----------|----------|--------|
        | 0 (front) | Full broker (all methods compete) | Primary visible surface |
        | 1 (back) | LSCM only | Fast, reliable, less visually important |

        ## Available Methods

        | Method | Algorithm | Notes |
        |--------|-----------|-------|
        | `heat` | Heat-geodesic MDS | O(n²), limit ~5K vertices |
        | `lscm` | Least Squares Conformal Maps | Fastest, most robust |
        | `igl_arap` | As-Rigid-As-Possible (libigl) | Good balance |
        | `slim` | Scalable Locally Injective Maps | Symmetric Dirichlet optimizer |
        | `cgal_conformal` | CGAL Discrete Conformal | Fast but high distortion |
        | `cgal_arap` | CGAL ARAP | Best reliability + quality balance |
        | `cgal_authalic` | CGAL Discrete Authalic | Area-preserving |
        | `cm` | Composite Majorization (Newton) | Best quality when converges (86% success) |
      operationId: parameterize
      parameters:
        - name: method
          in: query
          required: false
          description: >
            Parameterization method. Use "auto" to let the broker pick the best
            result from all methods.
          schema:
            type: string
            enum:
              - auto
              - heat
              - lscm
              - igl_arap
              - slim
              - cgal_conformal
              - cgal_arap
              - cgal_authalic
              - cm
            default: auto
      requestBody:
        required: true
        description: Raw GLB file content.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Parameterized GLB mesh with UV coordinates.
          headers:
            X-Method:
              description: The parameterization method used for the returned result.
              schema:
                type: string
                example: cgal_arap
            X-Metrics:
              description: >
                JSON object with quality metrics for the selected method.
              schema:
                type: string
              example: >
                {"angle_mean":0.02,"angle_max":0.15,"area_mean":0.03,"stretch_mean":1.01,"score":0.85,"sym_dirichlet":1.12,"flipped_tris":0,"l2_area":0.04,"linf_area":0.08}
            X-All-Methods:
              description: >
                JSON array with results and metrics from all attempted methods
                (only present when method=auto).
              schema:
                type: string
              example: >
                [{"method":"cgal_arap","score":0.85,"metrics":{...}},{"method":"heat","score":0.72,"metrics":{...}}]
            X-Session:
              description: Session identifier for correlating requests.
              schema:
                type: string
                example: abc123
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or unreadable GLB data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: All parameterization methods failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


  /api/docs:
    get:
      summary: API documentation UI
      description: Redirects to the Swagger UI page.
      operationId: getDocs
      responses:
        "302":
          description: Redirect to /swagger.html

  /api/openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns this OpenAPI specification in YAML format.
      operationId: getOpenApiSpec
      responses:
        "200":
          description: The OpenAPI 3.0 specification.
          content:
            text/yaml:
              schema:
                type: string

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
      required:
        - error
      example:
        error: Something went wrong

    Metrics:
      type: object
      description: Quality metrics for a parameterization result.
      properties:
        angle_mean:
          type: number
          format: double
          description: Mean angle distortion.
        angle_max:
          type: number
          format: double
          description: Maximum angle distortion.
        area_mean:
          type: number
          format: double
          description: Mean area distortion.
        stretch_mean:
          type: number
          format: double
          description: Mean stretch factor.
        score:
          type: number
          format: double
          description: Composite quality score (higher is better).
        sym_dirichlet:
          type: number
          format: double
          description: Symmetric Dirichlet energy.
        flipped_tris:
          type: integer
          description: Number of flipped (inverted) triangles in UV space.
        l2_area:
          type: number
          format: double
          description: L2 area distortion.
        linf_area:
          type: number
          format: double
          description: L-infinity area distortion.
